model_list:
  # DeepSeek V3 via OpenRouter (Flagship Coding & Reasoning Agent)
  - model_name: deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      # OpenRouter Baseline: $0.14 / 1M prompt, $0.28 / 1M completion
      # Boson Markup (+30% profit margin):
      input_cost_per_token: 0.000000182   # $0.182 / 1M tokens
      output_cost_per_token: 0.000000364  # $0.364 / 1M tokens

  # DeepSeek R1 (Extended Reasoning) via OpenRouter
  - model_name: deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      # OpenRouter Baseline: $0.55 / 1M prompt, $2.19 / 1M completion
      # Boson Markup (+30% profit margin):
      input_cost_per_token: 0.000000715   # $0.715 / 1M tokens
      output_cost_per_token: 0.000002847  # $2.847 / 1M tokens

  # Claude 3.5 Sonnet via OpenRouter
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      # OpenRouter Baseline: $3.00 / 1M prompt, $15.00 / 1M completion
      # Boson Markup (+25% profit margin):
      input_cost_per_token: 0.000003750   # $3.75 / 1M tokens
      output_cost_per_token: 0.000018750  # $18.75 / 1M tokens

  # GPT-4o via OpenRouter
  - model_name: gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      # OpenRouter Baseline: $2.50 / 1M prompt, $10.00 / 1M completion
      # Boson Markup (+25% profit margin):
      input_cost_per_token: 0.000003125   # $3.125 / 1M tokens
      output_cost_per_token: 0.000012500  # $12.50 / 1M tokens

litellm_settings:
  drop_params: true
  set_verbose: false
  # Proteksi Asal Web: Hanya izinkan domain web Anda. Domain lain akan ditolak (CORS 403).
  allowed_origins:
    - "https://yourdomain.com"
    - "https://*.yourdomain.com"
    - "http://localhost:3080"
    - "http://127.0.0.1:3080"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Enforce budget checks on virtual keys before proxying requests
  enforce_user_param: false
