# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION (BOSON STUDIO + GATEWAY)
# ==============================================================================
# Ganti "app.yourdomain.com" dengan domain asli Anda.

server {
    listen 80;
    server_name app.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    # 1. Routing API LLM ke LiteLLM Gateway (Port 4000 localhost)
    location /v1/ {
        # Proteksi: Tolak jika Origin berasal dari domain asing
        if ($http_origin ~* "^https?://(?!app\.yourdomain\.com|yourdomain\.com)") {
            return 403 "Akses dari domain luar ditolak.";
        }

        proxy_pass http://127.0.0.1:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mendukung SSE (Server-Sent Events) untuk streaming LLM
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 2. Routing Web Client ke Boson Studio (Port 3080 localhost)
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
