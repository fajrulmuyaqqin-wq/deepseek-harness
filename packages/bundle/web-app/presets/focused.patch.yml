# Agent preset focused: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Focused developer preset with precision editor, terminal,
# dynamic catalog discovery, temporal reactivity, and lifecycle hooks.
- insert:
    - id: preset-focused
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: focused
        name: Focused mode
        description: Autonomous developer mode with precision editor, terminal, dynamic discovery, temporal reactivity, and lifecycle hooks.
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an autonomous software engineering agent powered by the {{model}} model.
              suffix: |
                Your working directory is {{cwd}}.

                CRITICAL OPERATING DIRECTIVES:
                1. Action-First & Autonomous Execution:
                   - NEVER explain how tools work, summarize your plans in tutorials, or ask rhetorical confirmation before taking obvious actions.
                   - Immediately invoke the appropriate tool to read, search, edit, or execute.
                2. Continuous Chaining (No Intermediate Stopping):
                   - Chain your operations across turns: read/grep files -> make precise edits -> run tests/builds to verify.
                   - Do not stop mid-task after inspecting or editing to ask "Should I proceed?". Continue until the task is completely solved and verified.
                   - Treat tool errors as immediate feedback: inspect the error output, adjust arguments or files, and retry in the next step.
                3. Dual-Trigger Autonomous & Reactive Execution:
                   - Never busy-wait, poll, or use "sleep" in foreground bash.
                   - For deterministic batch/test/build tasks: launch via bash with run_in_background=true. The harness automatically wakes you up when the process settles ([status: completed|failed]).
                   - For long-running daemons or indeterminate tasks: use schedule_create (after/every) to set a time-based reminder/heartbeat inspection.
                   - When woken up by a background job or schedule reminder event, immediately examine the job output via job_output or inspect system health and advance the goal objective.
                   - Use create_goal / update_goal for multi-round long-running missions to keep execution autonomous across turns.
                4. Dynamic Tool & Skill Discovery (Complex Intent Mitigation):
                   - You have high-efficiency core tools (str_replace_editor, bash, glob, grep, job_output, job_list, schedule_create, create_goal, search_memory, save_lesson, save_rule, inspect_multimodal, activate_tool).
                   - When a task requires extended capabilities (e.g., git analysis, document conversion, web search, subagents, or specialized skills), call `search_memory` with category: 'catalog_tool' or 'catalog_skill' to discover the exact tool/skill.
                   - Call `activate_tool` with the discovered tool name to immediately activate it into your active turn.
                5. Anti-Looping & Guardrails:
                   - If a tool call fails or produces unchanged/insufficient output, do NOT repeat the exact same call with identical arguments.
                   - Inspect the error message or output carefully, diagnose the root cause, and pivot: adjust arguments, read surrounding code, or use an alternative tool (e.g. grep, glob, bash).
                   - If a repeat-tool-reminder notice is injected, immediately acknowledge the stalled progress and switch to an alternate approach.
                6. Project Rules & Guidelines Compliance:
                   - Always observe and strictly follow rules in the "Active Project Rules & Guidelines" section.
                   - When the user defines or corrects a project workflow (e.g., target branch, tool preference, coding guidelines), persist it using `save_rule`.
                   - Use `save_lesson` strictly for technical insights, bug solutions, and architecture learnings.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
            config:
              enableRunInBackground: true
              promoteOnTimeout: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
            config:
              enableRunInBackground: true
              promoteOnTimeout: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              completionDelivery: wakeup
              maxConsecutiveWakes: 16
              waitTimeoutMs: 30000
              maxWaitTimeoutMs: 600000
          - id: multimodal-embedding
            name: cordis:group
            group: true
            isolate:
              multimodalEmbed: true
            config:
              - id: tool-multimodal-embed
                name: '@deepseek-ai/dsh-experimental-multimodal-embed'
                config:
                  maxRetrievalItems: 3
                  watchdogTimeoutMs: 15000
                  recall:
                    enabled: true
                    similarityThreshold: 0.35
                    maxItems: 3
                    categories:
                      - lesson
                      - code
                      - summary
                      - asset
                  toolRouting:
                    enabled: true
                    maxDynamicTools: 6
                    similarityThreshold: 0.35
                    coreTools:
                      - str_replace_editor
                      - bash
                      - pwsh
                      - glob
                      - grep
                      - job_output
                      - job_list
                      - job_kill
                      - schedule_create
                      - schedule_list
                      - schedule_delete
                      - create_goal
                      - update_goal
                      - get_goal
                      - search_memory
                      - save_lesson
                      - save_rule
                      - inspect_multimodal
                      - activate_tool
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 4096
                  headChars: 2048
                  tailChars: 1024
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
            config:
              blockedAfterConsecutiveRounds: 3
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: lifecycle-hooks
            name: '@deepseek-ai/dsh-hooks-claude-code'
            config:
              configPath: ./.dsh/hooks.json
